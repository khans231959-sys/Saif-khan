<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard">

        <header>
            My Dashboard
        </header>

        <aside>
            <h2>Menu</h2>

            <ul>
                <li>Home</li>
                <li>Profile</li>
                <li>Settings</li>
                <li>Reports</li>
                <li>Logout</li>
            </ul>
        </aside>

        <main>
            <h1>Dashboard Overview</h1>

            <p>Welcome to your dashboard!</p>

            <div class="cards">

                <div class="card">
                    <h2>150</h2>
                    <p>Total Users</p>
                </div>

                <div class="card">
                    <h2>85</h2>
                    <p>Orders</p>
                </div>

                <div class="card">
                    <h2>45</h2>
                    <p>Products</p>
                </div>

                <div class="card">
                    <h2>25</h2>
                    <p>Messages</p>
                </div>

            </div>
        </main>

        <footer>
            Copyright 2026 My Dashboard
        </footer>

    </div>

</body>
</html>
