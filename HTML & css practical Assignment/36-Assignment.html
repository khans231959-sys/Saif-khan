
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="style.css">

    <style>

        
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f4;
}

header {
    text-align: center;
    padding: 35px 15px;
    background-color: #222;
    color: white;
}

header h1 {
    margin-bottom: 10px;
    font-size: 32px;
}

header p {
    color: #ddd;
}

/* Photo Gallery */
.gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    padding: 30px;
}

.gallery-item {
    overflow: hidden;
    border-radius: 10px;
    height: 230px;
}

.gallery-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.4s;
}

.gallery-item img:hover {
    transform: scale(1.1);
}

/* Responsive Design */
@media (max-width: 768px) {
    .gallery {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 480px) {
    .gallery {
        grid-template-columns: 1fr;
    }
}

    </style>
</head>
<body>

    <header>
        <h1>My Photo Gallery</h1>
        <p>Beautiful moments captured in pictures</p>
    </header>

    <section class="gallery">

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee"
                 alt="Mountain landscape">
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e"
                 alt="Beautiful beach">
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e"
                 alt="Lake and mountains">
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e"
                 alt="Green forest">
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b"
                 alt="Ocean waves">
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8"
                 alt="Sunrise landscape">
        </div>

    </section>

</body>
</html>
