
<!--
Assignment 32
Question: Build a responsive photo gallery using CSS Grid.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Photo Gallery</title>
    <link rel="stylesheet" href="style.css">

    <style>


/*
Assignment 32
Build a responsive photo gallery using CSS Grid.
*/

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #f1f5f9;
    color: #222;
}

/* Header */
header {
    background-color: #17324d;
    color: white;
    text-align: center;
    padding: 30px;
}

/* Main Section */
main {
    max-width: 1100px;
    margin: 30px auto;
    padding: 20px;
}

main h2 {
    text-align: center;
    color: #17324d;
    margin-bottom: 25px;
}

/* CSS Grid Gallery */
.gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

/* Gallery Cards */
.gallery-item {
    background-color: white;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 4px 10px #00000015;
    text-align: center;
}

.gallery-item img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    display: block;
}

.gallery-item h3 {
    padding: 10px;
    color: #17324d;
}

/* Footer */
footer {
    background-color: #17324d;
    color: white;
    text-align: center;
    padding: 15px;
}

/* Tablet */
@media (max-width: 800px) {
    .gallery {
        grid-template-columns: repeat(2, 1fr);
    }
}

/* Mobile */
@media (max-width: 500px) {
    .gallery {
        grid-template-columns: 1fr;
    }
}


    </style>
</head>
<body>

    <header>
        <h1>My Photo Gallery</h1>
        <p>A beautiful collection of nature photographs</p>
    </header>

    <main>
        <h2>Explore Gallery</h2>

        <div class="gallery">

            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=600" alt="Beautiful mountain lake">
                <h3>Mountain Lake</h3>
            </div>

            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=600" alt="Beautiful nature landscape">
                <h3>Nature</h3>
            </div>

            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=600" alt="Sunrise in nature">
                <h3>Sunrise</h3>
            </div>

            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600" alt="Green forest">
                <h3>Green Forest</h3>
            </div>

            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600" alt="Beautiful beach">
                <h3>Beach</h3>
            </div>

            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=600" alt="Snowy mountains">
                <h3>Snowy Mountains</h3>
            </div>

        </div>
    </main>

    <footer>
        <p>© 2026 My Photo Gallery</p>
    </footer>

</body>
</html>
