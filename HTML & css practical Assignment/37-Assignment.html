
<!DOCTYPE html>
<html>
<head>
    <title>Responsive Product Grid</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }

        .product-container {
            display: grid;

            grid-template-columns:
            repeat(auto-fit, minmax(220px, 1fr));

            gap: 20px;
        }

        .product {
            background-color: white;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        .product img {
            width: 100%;
            height: 180px;
            object-fit: contain;
        }

        .product h2 {
            margin: 15px 0;
            font-size: 20px;
        }

        .product p {
            color: green;
            font-size: 18px;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: darkblue;
        }
    </style>
</head>

<body>

    <h1>Our Products</h1>

    <div class="product-container">

        <div class="product">
            <img src="https://placehold.co/300x200?text=Laptop" alt="Laptop">
            <h2>Laptop</h2>
            <p>₹50,000</p>
            <button>Buy Now</button>
        </div>

        <div class="product">
            <img src="https://placehold.co/300x200?text=Mobile" alt="Mobile">
            <h2>Mobile</h2>
            <p>₹20,000</p>
            <button>Buy Now</button>
        </div>

        <div class="product">
            <img src="https://placehold.co/300x200?text=Headphones" alt="Headphones">
            <h2>Headphones</h2>
            <p>₹2,000</p>
            <button>Buy Now</button>
        </div>

        <div class="product">
            <img src="https://placehold.co/300x200?text=Smart+Watch" alt="Smart Watch">
            <h2>Smart Watch</h2>
            <p>₹3,000</p>
            <button>Buy Now</button>
        </div>

    </div>

</body>
</html>
