
<!DOCTYPE html>
<html>
<head>
    <title>Dashboard Layout</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        .dashboard {
            display: grid;

            grid-template-areas:
                "header header"
                "sidebar main"
                "footer footer";

            grid-template-columns: 220px 1fr;
            grid-template-rows: 70px 1fr 60px;

            min-height: 100vh;
            gap: 10px;
        }

        header {
            grid-area: header;
            background-color: #1e3a8a;
            color: white;
            padding: 20px;
            font-size: 24px;
        }

        aside {
            grid-area: sidebar;
            background-color: #333;
            color: white;
            padding: 20px;
        }

        aside ul {
            list-style: none;
        }

        aside li {
            padding: 15px 0;
        }

        main {
            grid-area: main;
            padding: 20px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background-color: white;
            padding: 30px 15px;
            text-align: center;
            border-radius: 8px;
            box-shadow: 0 2px 5px #ccc;
        }

        .card h2 {
            color: #1e3a8a;
            margin-bottom: 10px;
        }

        footer {
            grid-area: footer;
            background-color: #1e3a8a;
            color: white;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 600px) {
            .dashboard {
                grid-template-areas:
                    "header"
                    "sidebar"
                    "main"
                    "footer";

                grid-template-columns: 1fr;
                grid-template-rows: auto;
            }
        }
    </style>
</head>

<body>

    <div class="dashboard">

        <header>
            My Dashboard
        </header>

        <aside>
            <h2>Menu</h2>

            <ul>
                <li>Home</li>
                <li>Profile</li>
                <li>Settings</li>
                <li>Reports</li>
                <li>Logout</li>
            </ul>
        </aside>

        <main>
            <h1>Dashboard Overview</h1>

            <p>Welcome to your dashboard!</p>

            <div class="cards">

                <div class="card">
                    <h2>150</h2>
                    <p>Total Users</p>
                </div>

                <div class="card">
                    <h2>85</h2>
                    <p>Orders</p>
                </div>

                <div class="card">
                    <h2>45</h2>
                    <p>Products</p>
                </div>

                <div class="card">
                    <h2>25</h2>
                    <p>Messages</p>
                </div>

            </div>
        </main>

        <footer>
            Copyright 2026 My Dashboard
        </footer>

    </div>

</body>
</html>
