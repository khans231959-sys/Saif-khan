<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clickable Image</title>
</head>
<body>
    <h1>My Favourite Website</h1>

    <p>Click the image below to visit Google.</p>

    <a href="https://www.google.com" target="_blank">
        <img
            src="https://placehold.co/300x150?text=Visit+Google"
            alt="Click to visit Google"
            width="300"
        >
    </a>
</body>
</html>
