<!-- Assignment 20: Submit the complete multi-page HTML project (Home, About, Registration, Contact). -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration | Student Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Student Registration</h1>
        <p>Create Your Student Account</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="registration.html">Registration</a>
        <a href="contact.html">Contact</a>
    </nav>

    <main>
        <section class="form-container">
            <h2>Registration Form</h2>

            <form action="#" method="post">
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname"
                       placeholder="Enter your full name" required>

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email"
                       placeholder="Enter your email" required>

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone"
                       placeholder="Enter your phone number" required>

                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob" required>

                <label for="course">Select Course:</label>
                <select id="course" name="course" required>
                    <option value="">Choose a course</option>
                    <option value="html-css">HTML and CSS</option>
                    <option value="javascript">JavaScript</option>
                    <option value="java">Java Programming</option>
                    <option value="python">Python Programming</option>
                </select>

                <label for="message">Why do you want to join?</label>
                <textarea id="message" name="message" rows="4"
                          placeholder="Write your message"></textarea>

                <button type="submit">Submit Registration</button>
            </form>

            <p class="note">
                Note: This is a front-end demonstration form. It does not save
                registration details to a database.
            </p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Student Portal. All rights reserved.</p>
    </footer>

</body>
</html>
