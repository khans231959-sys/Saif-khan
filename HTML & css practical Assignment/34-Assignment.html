
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Navbar and Hero</title>
    <link rel="stylesheet" href="style.css">

    <style>

        
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
}

/* Navbar */
.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background-color: #222;
    padding: 20px 8%;
}

.logo {
    color: white;
    font-size: 25px;
    font-weight: bold;
}

.nav-links {
    display: flex;
    list-style: none;
    gap: 30px;
}

.nav-links a {
    color: white;
    text-decoration: none;
    font-size: 17px;
}

.nav-links a:hover {
    color: orange;
}

/* Hero Section */
.hero {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 70px 8%;
    gap: 40px;
    background-color: #f2f5ff;
}

.hero-content {
    flex: 1;
}

.hero-content h1 {
    font-size: 42px;
    color: #222;
    margin-bottom: 20px;
}

.hero-content p {
    font-size: 18px;
    color: #555;
    line-height: 1.6;
    margin-bottom: 25px;
}

.hero-content button {
    background-color: #2563eb;
    color: white;
    border: none;
    padding: 13px 25px;
    border-radius: 5px;
    font-size: 16px;
    cursor: pointer;
}

.hero-content button:hover {
    background-color: #1745a5;
}

.hero-image {
    flex: 1;
}

.hero-image img {
    width: 100%;
    border-radius: 12px;
}

/* Responsive Design */
@media (max-width: 768px) {

    .navbar {
        flex-direction: column;
        gap: 20px;
    }

    .nav-links {
        flex-wrap: wrap;
        justify-content: center;
        gap: 15px;
    }

    .hero {
        flex-direction: column;
        text-align: center;
    }

    .hero-content h1 {
        font-size: 30px;
    }
}

    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">MyWebsite</div>

        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h1>Welcome to My Website</h1>

            <p>
                We create modern and responsive websites
                using HTML and CSS.
            </p>

            <button>Get Started</button>
        </div>

        <div class="hero-image">
            <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085"
                 alt="Laptop on a desk">
        </div>
    </section>

</body>
</html>
