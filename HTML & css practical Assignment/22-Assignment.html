Assignment 22
Question: Style a page using at least four different selector types correctly.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors</title>
    <link rel="stylesheet" href="style.css">

    <style>

       
/*
Assignment 22
Use at least four different selector types.
*/

/* 1. Element Selector */
body {
    font-family: Arial, sans-serif;
    background-color: #f2f2f2;
    margin: 0;
}

/* 2. Element Selector */
header {
    background-color: navy;
    color: white;
    text-align: center;
    padding: 25px;
}

/* 3. Class Selector */
.intro {
    color: green;
    font-size: 18px;
}

/* 4. ID Selector */
#special {
    color: red;
    font-weight: bold;
}

/* 5. Class Selector */
.box {
    background-color: white;
    padding: 20px;
    margin: 20px 0;
    border: 2px solid navy;
}

/* 6. Group Selector */
h2, h3 {
    color: darkblue;
}

/* 7. Descendant Selector */
.box p {
    color: purple;
}

/* 8. Element Selector */
button {
    background-color: navy;
    color: white;
    padding: 10px 20px;
    border: none;
    cursor: pointer;
}

/* 9. Pseudo-class Selector */
button:hover {
    background-color: green;
}

footer {
    background-color: #222;
    color: white;
    text-align: center;
    padding: 15px;
}
 
    </style>
</head>
<body>

    <header>
        <h1>CSS Selectors Practice</h1>
        <p>Learning different types of CSS selectors</p>
    </header>

    <main>
        <h2>Welcome to My Website</h2>

        <p class="intro">
            CSS is used to style HTML elements.
        </p>

        <p id="special">
            This paragraph uses an ID selector.
        </p>

        <div class="box">
            <h3>About CSS</h3>
            <p>CSS makes websites beautiful and attractive.</p>
        </div>

        <button>Learn More</button>
    </main>

    <footer>
        <p>Created by a Web Development Student</p>
    </footer>

</body>
</html>


</body>
</html>
