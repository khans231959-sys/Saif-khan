
<!--
Assignment 30
Question: Build a responsive navigation bar using Flexbox.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Navigation Bar</title>
    <link rel="stylesheet" href="style.css">

    <style>

        
/*
Assignment 30
Build a responsive navigation bar using Flexbox.
*/

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #f1f5f9;
}

/* Navigation Bar */
.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background-color: #17324d;
    padding: 20px 40px;
    flex-wrap: wrap;
}

/* Logo */
.logo {
    color: white;
    font-size: 25px;
    font-weight: bold;
}

/* Navigation Links */
.nav-links {
    display: flex;
    gap: 25px;
}

.nav-links a {
    color: white;
    text-decoration: none;
    font-size: 16px;
}

.nav-links a:hover {
    color: #facc15;
}

/* Login Button */
.login-btn {
    background-color: #facc15;
    color: #17324d;
    border: none;
    padding: 10px 20px;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
}

/* Main Content */
main {
    max-width: 1000px;
    margin: 30px auto;
    padding: 20px;
}

section {
    background-color: white;
    padding: 25px;
    margin-bottom: 20px;
    border-radius: 8px;
}

h1, h2 {
    color: #17324d;
}

/* Footer */
footer {
    background-color: #17324d;
    color: white;
    text-align: center;
    padding: 15px;
}

/* Responsive Design */
@media (max-width: 650px) {

    .navbar {
        flex-direction: column;
        gap: 20px;
    }

    .nav-links {
        flex-direction: column;
        align-items: center;
        gap: 15px;
    }

    .login-btn {
        width: 100%;
    }
}

    </style>
</head>
<body>

    <header class="navbar">

        <div class="logo">
            MyWebsite
        </div>

        <nav class="nav-links">
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#services">Services</a>
            <a href="#contact">Contact</a>
        </nav>

        <button class="login-btn">Login</button>

    </header>

    <main>
        <section id="home">
            <h1>Welcome to My Website</h1>
            <p>This navigation bar is created using CSS Flexbox.</p>
        </section>

        <section id="about">
            <h2>About Us</h2>
            <p>We are learning HTML and CSS.</p>
        </section>

        <section id="services">
            <h2>Our Services</h2>
            <p>We create modern and responsive websites.</p>
        </section>

        <section id="contact">
            <h2>Contact Us</h2>
            <p>Email: example@gmail.com</p>
        </section>
    </main>

    <footer>
        <p>© 2026 MyWebsite. All Rights Reserved.</p>
    </footer>

</body>
</html>
